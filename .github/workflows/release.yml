name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - run: gradle :app:assembleDebug :app:assembleRelease

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk owo-hunt-v0.1.0-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk owo-hunt-v0.1.0-release-unsigned.apk || true

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            owo-hunt-v0.1.0-debug.apk
            owo-hunt-v0.1.0-release-unsigned.apk
